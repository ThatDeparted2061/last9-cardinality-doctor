# Generated by cardinality-doctor: add under each scrape job.
# Only drops that merge no series are done here. These need aggregation at ingest:
#   http_requests_total: aggregate away user_id (sum) in the collector
#   http_request_duration_seconds_bucket: aggregate away route_path (sum) in the collector
#   session_events_total: aggregate away session_id (sum) in the collector
#   batch_job_last_success_timestamp_seconds: aggregate away run_id (max) in the collector
metric_relabel_configs:
    - action: replace
      regex: container_cpu_usage_seconds_total
      replacement: ""
      source_labels:
        - __name__
      target_label: pod_ip
