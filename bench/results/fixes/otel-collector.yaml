# Generated by cardinality-doctor: merge into your OpenTelemetry Collector config.
processors:
    cumulativetodelta: {}
    deltatocumulative: {}
    metricstransform/cardinality:
        transforms:
            - action: update
              include: http_requests_total
              operations:
                - action: aggregate_labels
                  aggregation_type: sum
                  label_set:
                    - method
                    - route
                    - service
                    - status
            - action: update
              include: http_request_duration_seconds
              operations:
                - action: aggregate_labels
                  aggregation_type: sum
                  label_set:
                    - route_path
                    - service
            - action: update
              include: session_events_total
              operations:
                - action: aggregate_labels
                  aggregation_type: sum
                  label_set:
                    - event
                    - tenant
            - action: update
              include: batch_job_last_success_timestamp_seconds
              operations:
                - action: aggregate_labels
                  aggregation_type: max
                  label_set:
                    - job
            - action: update
              include: container_cpu_usage_seconds_total
              operations:
                - action: aggregate_labels
                  aggregation_type: sum
                  label_set:
                    - container
                    - namespace
                    - pod
    transform/cardinality:
        error_mode: ignore
        metric_statements:
            - context: datapoint
              statements:
                - replace_pattern(datapoint.attributes["route_path"], "/([0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}|[0-9a-fA-F]{12,})(/|$)", "/{id}$$2") where metric.name == "http_request_duration_seconds"
service:
    pipelines:
        metrics:
            processors:
                - cumulativetodelta
                - transform/cardinality
                - metricstransform/cardinality
                - deltatocumulative
                - batch
